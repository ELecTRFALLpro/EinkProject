apiVersion: v1
kind: Namespace
metadata:
  name: eink-system
  labels:
    app.kubernetes.io/part-of: eink-project
---
apiVersion: v1
kind: Secret
metadata:
  name: eink-postgres-secret
  namespace: eink-system
type: Opaque
stringData:
  POSTGRES_USER: "eink_user"
  POSTGRES_PASSWORD: "eink_pass_2026"
  POSTGRES_DB: "eink_db"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eink-postgres-pvc
  namespace: eink-system
  labels:
    app: eink-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: eink-postgres
  namespace: eink-system
  labels:
    app: eink-postgres
spec:
  serviceName: "eink-postgres-svc"
  replicas: 1
  selector:
    matchLabels:
      app: eink-postgres
  template:
    metadata:
      labels:
        app: eink-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: eink-postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: TZ
              value: Asia/Shanghai
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U eink_user -d eink_db
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U eink_user -d eink_db
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: eink-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: eink-postgres-svc
  namespace: eink-system
  labels:
    app: eink-postgres
spec:
  type: NodePort
  selector:
    app: eink-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30432

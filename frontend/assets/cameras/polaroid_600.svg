<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">

  <defs>
    <!-- Hand-drawn organic pen/brush contour wobble -->
    <filter id="handInk" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.048" numOctaves="3" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Tactile gouache / cold-press watercolor paper grain -->
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="11" result="grain"/>
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.20
        0 0 0 0 0.16
        0 0 0 0 0.12
        0 0 0 0.14 0" in="grain" result="softGrain"/>
      <feComposite in="softGrain" in2="SourceGraphic" operator="atop"/>
    </filter>
    <!-- Soft painterly gouache lighting wash -->
    <linearGradient id="gouacheSheen" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#221912" stop-opacity="0.16"/>
    </linearGradient>
    <!-- Leatherette hand-stippled texture -->
    <pattern id="leatherTex" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.8" cy="2" r="0.95" fill="#18120E" fill-opacity="0.18"/>
      <circle cx="5.2" cy="4.8" r="0.85" fill="#18120E" fill-opacity="0.14"/>
      <circle cx="4.8" cy="1.4" r="0.65" fill="#FFFDF8" fill-opacity="0.08"/>
      <circle cx="1.5" cy="5.5" r="0.6" fill="#FFFDF8" fill-opacity="0.06"/>
    </pattern>
    <!-- Hand-drawn cross-hatch shadow pattern -->
    <pattern id="sketchHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#231D18" stroke-opacity="0.22" stroke-width="1.1"/>
    </pattern>
    <!-- Studio lens glass radial gradients -->
    <radialGradient id="lensGlass" cx="36%" cy="33%" r="68%">
      <stop offset="0%" stop-color="#486B8A"/>
      <stop offset="36%" stop-color="#1E2C3B"/>
      <stop offset="72%" stop-color="#0E1319"/>
      <stop offset="100%" stop-color="#050709"/>
    </radialGradient>
    <radialGradient id="lensGlassWarm" cx="36%" cy="33%" r="68%">
      <stop offset="0%" stop-color="#7A5640"/>
      <stop offset="38%" stop-color="#2C1F1A"/>
      <stop offset="75%" stop-color="#140E0C"/>
      <stop offset="100%" stop-color="#070505"/>
    </radialGradient>
    <radialGradient id="lensGlassRose" cx="36%" cy="33%" r="68%">
      <stop offset="0%" stop-color="#7B5065"/>
      <stop offset="38%" stop-color="#2B1C25"/>
      <stop offset="76%" stop-color="#130C10"/>
      <stop offset="100%" stop-color="#070406"/>
    </radialGradient>
    <radialGradient id="lensGlassGreen" cx="36%" cy="33%" r="68%">
      <stop offset="0%" stop-color="#35785D"/>
      <stop offset="38%" stop-color="#163227"/>
      <stop offset="76%" stop-color="#0B1813"/>
      <stop offset="100%" stop-color="#050A08"/>
    </radialGradient>
    <pattern id="flashRibs" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#ECEAE4"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#B7B2A8" stroke-width="1.5"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#FFFFFF" stroke-width="0.9" stroke-opacity="0.75"/>
    </pattern>
  </defs>

  <g filter="url(#handInk)">
    
  
    <ellipse cx="160" cy="284" rx="106" ry="10" fill="url(#sketchHatch)"/>
    <ellipse cx="160" cy="282" rx="102" ry="9" fill="#231B14" fill-opacity="0.16"/>
    
  <rect x="64" y="42" width="192" height="58" rx="14" fill="#2A2724" stroke="#181411" stroke-width="2.8"/>
  <path d="M74 49 L246 49" stroke="#FFFDF8" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round"/>
  <rect x="135" y="51" width="42" height="36" rx="7" fill="#131110" stroke="#4D4741" stroke-width="1.8"/>
  <rect x="142" y="57" width="28" height="24" rx="4" fill="url(#lensGlass)"/>
  <path d="M146 62 L157 62" stroke="#FFF" stroke-opacity="0.7" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="78" y="58" width="46" height="16" rx="4" fill="#3B3733" stroke="#181411" stroke-width="1.2"/>
  <circle cx="88" cy="66" r="3.5" fill="#F4EFE4"/>
  <line x1="95" y1="66" x2="118" y2="66" stroke="#F4EFE4" stroke-width="2.2" stroke-linecap="round"/>

  <rect x="54" y="92" width="212" height="156" rx="18" fill="#F4EDE0" stroke="#241E1B" stroke-width="3" filter="url(#paperGrain)"/>
  <rect x="54" y="92" width="212" height="156" rx="18" fill="url(#gouacheSheen)"/>
  <path d="M56 206 L264 206 L264 230 Q264 246 248 246 L72 246 Q56 246 56 230 Z" fill="#DED3C0" fill-opacity="0.72"/>
  <line x1="56" y1="206" x2="264" y2="206" stroke="#241E1B" stroke-width="2.1"/>

  <g>
    <rect x="144" y="182" width="6.4" height="63" fill="#FF3B30"/>
    <rect x="150.4" y="182" width="6.4" height="63" fill="#FF9500"/>
    <rect x="156.8" y="182" width="6.4" height="63" fill="#FFCC00"/>
    <rect x="163.2" y="182" width="6.4" height="63" fill="#34C759"/>
    <rect x="169.6" y="182" width="6.4" height="63" fill="#007AFF"/>
    <rect x="144" y="182" width="32" height="63" fill="none" stroke="#241E1B" stroke-width="1.8"/>
  </g>

  <rect x="72" y="116" width="44" height="22" rx="4" fill="#2A2724" stroke="#181411" stroke-width="1.6"/>
  <line x1="79" y1="124" x2="108" y2="124" stroke="#F4EFE6" stroke-width="2.3" stroke-linecap="round"/>
  <line x1="79" y1="131" x2="100" y2="131" stroke="#CFC7B8" stroke-width="1.8" stroke-linecap="round"/>

  <circle cx="94" cy="172" r="17" fill="#E3DACB" stroke="#241E1B" stroke-width="2"/>
  <circle cx="94" cy="172" r="13" fill="#EB3B2E" stroke="#241E1B" stroke-width="2.2"/>
  <path d="M87 166 A8 8 0 0 1 99 164" fill="none" stroke="#FFF" stroke-opacity="0.65" stroke-width="2.4" stroke-linecap="round"/>

  <rect x="210" y="114" width="34" height="28" rx="6" fill="#201D1B" stroke="#241E1B" stroke-width="2"/>
  <rect x="215" y="119" width="24" height="18" rx="3" fill="url(#flashRibs)"/>
  <circle cx="227" cy="172" r="14" fill="#2B2724" stroke="#181411" stroke-width="2.2"/>
  <circle cx="227" cy="172" r="9" fill="#4B4640" stroke="#181411" stroke-width="1.5"/>
  <line x1="227" y1="164" x2="227" y2="171" stroke="#F4EFE6" stroke-width="2.2" stroke-linecap="round"/>

  
    <!-- Sketchy Gouache Cast Shadow Under Lens -->
    <ellipse cx="162" cy="153" rx="46" ry="45" fill="url(#sketchHatch)"/>
    <ellipse cx="162" cy="151" rx="44" ry="44" fill="#1C1612" fill-opacity="0.16"/>
    <!-- Outer Metal Barrel -->
    <circle cx="160" cy="146" r="42" fill="#292623" stroke="#231D18" stroke-width="2.8" filter="url(#paperGrain)"/>
    <circle cx="160" cy="146" r="42" fill="url(#gouacheSheen)"/>
    <path d="M 129.8 128.4 A 39.0 39.0 0 0 1 183.5 119.1"
          fill="none" stroke="#FFFDF8" stroke-opacity="0.58" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="160" cy="146" r="36.5" fill="none" stroke="#EAE4D8" stroke-width="3.4"/>
    <!-- Stepped Inner Barrel -->
    <circle cx="160" cy="146" r="32.8" fill="#161413" stroke="#191512" stroke-width="2.2"/>
    <circle cx="160" cy="146" r="27.3" fill="#151414" stroke="#6E6860" stroke-width="1.3" stroke-dasharray="2.4 2.8"/>
    <!-- Hand-painted Glass Dome -->
    <circle cx="160" cy="146" r="22.7" fill="url(#lensGlass)" stroke="#0D0B0A" stroke-width="2"/>
    <!-- Expressive Brush Glints -->
    <path d="M 146.1 139.3 A 15.1 15.1 0 0 1 165.9 130.9"
          fill="none" stroke="#FFFDF8" stroke-opacity="0.78" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 151.6 158.6 A 13.4 13.4 0 0 0 167.6 156.9"
          fill="none" stroke="#9BD0EA" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
    <circle cx="155.0" cy="141.8" r="2.3" fill="#FFFFFF" fill-opacity="0.88"/>
    

  <rect x="64" y="246" width="192" height="30" rx="7" fill="#252220" stroke="#181411" stroke-width="2.6"/>
  <rect x="78" y="256" width="164" height="8" rx="3" fill="#0E0D0C"/>

  </g>
</svg>
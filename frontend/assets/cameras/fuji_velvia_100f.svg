<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">

  <defs>
    <!-- Hand-drawn organic pen/brush contour wobble -->
    <filter id="handInk" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.048" numOctaves="3" seed="88" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Tactile gouache / cold-press watercolor paper grain -->
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="88" result="grain"/>
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.20
        0 0 0 0 0.16
        0 0 0 0 0.12
        0 0 0 0.14 0" in="grain" result="softGrain"/>
      <feComposite in="softGrain" in2="SourceGraphic" operator="atop"/>
    </filter>
    <!-- Soft painterly gouache lighting wash -->
    <linearGradient id="gouacheSheen" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#221912" stop-opacity="0.16"/>
    </linearGradient>
    <!-- Leatherette hand-stippled texture -->
    <pattern id="leatherTex" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.8" cy="2" r="0.95" fill="#18120E" fill-opacity="0.18"/>
      <circle cx="5.2" cy="4.8" r="0.85" fill="#18120E" fill-opacity="0.14"/>
      <circle cx="4.8" cy="1.4" r="0.65" fill="#FFFDF8" fill-opacity="0.08"/>
      <circle cx="1.5" cy="5.5" r="0.6" fill="#FFFDF8" fill-opacity="0.06"/>
    </pattern>
    <!-- Hand-drawn cross-hatch shadow pattern -->
    <pattern id="sketchHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#231D18" stroke-opacity="0.22" stroke-width="1.1"/>
    </pattern>
    <!-- Studio lens glass radial gradients -->
    <radialGradient id="lensGlass" cx="36%" cy="33%" r="68%">
      <stop offset="0%" stop-color="#486B8A"/>
      <stop offset="36%" stop-color="#1E2C3B"/>
      <stop offset="72%" stop-color="#0E1319"/>
      <stop offset="100%" stop-color="#050709"/>
    </radialGradient>
    <radialGradient id="lensGlassWarm" cx="36%" cy="33%" r="68%">
      <stop offset="0%" stop-color="#7A5640"/>
      <stop offset="38%" stop-color="#2C1F1A"/>
      <stop offset="75%" stop-color="#140E0C"/>
      <stop offset="100%" stop-color="#070505"/>
    </radialGradient>
    <radialGradient id="lensGlassRose" cx="36%" cy="33%" r="68%">
      <stop offset="0%" stop-color="#7B5065"/>
      <stop offset="38%" stop-color="#2B1C25"/>
      <stop offset="76%" stop-color="#130C10"/>
      <stop offset="100%" stop-color="#070406"/>
    </radialGradient>
    <radialGradient id="lensGlassGreen" cx="36%" cy="33%" r="68%">
      <stop offset="0%" stop-color="#35785D"/>
      <stop offset="38%" stop-color="#163227"/>
      <stop offset="76%" stop-color="#0B1813"/>
      <stop offset="100%" stop-color="#050A08"/>
    </radialGradient>
    <pattern id="flashRibs" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#ECEAE4"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#B7B2A8" stroke-width="1.5"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#FFFFFF" stroke-width="0.9" stroke-opacity="0.75"/>
    </pattern>
  </defs>

  <g filter="url(#handInk)">
    
  
    <ellipse cx="160" cy="270" rx="118" ry="10" fill="url(#sketchHatch)"/>
    <ellipse cx="160" cy="268" rx="114" ry="9" fill="#231B14" fill-opacity="0.16"/>
    
  <rect x="64" y="64" width="24" height="14" rx="3.5" fill="#CFD6D2" stroke="#16221D" stroke-width="2.1"/><line x1="68" y1="66" x2="68" y2="76" stroke="#16221D" stroke-opacity="0.32" stroke-width="1.2"/><line x1="73" y1="66" x2="73" y2="76" stroke="#16221D" stroke-opacity="0.32" stroke-width="1.2"/><line x1="78" y1="66" x2="78" y2="76" stroke="#16221D" stroke-opacity="0.32" stroke-width="1.2"/><line x1="83" y1="66" x2="83" y2="76" stroke="#16221D" stroke-opacity="0.32" stroke-width="1.2"/>
  <rect x="102" y="59" width="28" height="19" rx="3.5" fill="#1E7A55" stroke="#16221D" stroke-width="2.1"/><line x1="106" y1="61" x2="106" y2="76" stroke="#16221D" stroke-opacity="0.32" stroke-width="1.2"/><line x1="111" y1="61" x2="111" y2="76" stroke="#16221D" stroke-opacity="0.32" stroke-width="1.2"/><line x1="116" y1="61" x2="116" y2="76" stroke="#16221D" stroke-opacity="0.32" stroke-width="1.2"/><line x1="121" y1="61" x2="121" y2="76" stroke="#16221D" stroke-opacity="0.32" stroke-width="1.2"/><line x1="126" y1="61" x2="126" y2="76" stroke="#16221D" stroke-opacity="0.32" stroke-width="1.2"/>

  <rect x="40" y="78" width="240" height="52" rx="12" fill="#DAE0DC" stroke="#16221D" stroke-width="2.8" filter="url(#paperGrain)"/>
  <rect x="40" y="122" width="240" height="130" rx="14" fill="#232926" stroke="#141A17" stroke-width="2.8" filter="url(#paperGrain)"/>
  <rect x="40" y="122" width="240" height="130" rx="14" fill="url(#leatherTex)"/>
  <rect x="40" y="78" width="240" height="174" rx="14" fill="url(#gouacheSheen)"/>
  <path d="M52 86 L268 86" stroke="#FFFDF8" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>

  <rect x="218" y="88" width="40" height="28" rx="5" fill="#151A18" stroke="#16221D" stroke-width="2"/>
  <rect x="224" y="93" width="28" height="18" rx="3" fill="url(#lensGlassGreen)"/>
  <rect x="178" y="90" width="30" height="24" rx="4" fill="#1C2420" stroke="#16221D" stroke-width="1.8"/>
  <rect x="114" y="93" width="18" height="18" rx="3" fill="#151A18" stroke="#16221D" stroke-width="1.8"/>

  <rect x="64" y="146" width="26" height="12" rx="4" fill="#D8436A" stroke="#16221D" stroke-width="1.7"/>
  
    <!-- Sketchy Gouache Cast Shadow Under Lens -->
    <ellipse cx="166" cy="191" rx="60" ry="59" fill="url(#sketchHatch)"/>
    <ellipse cx="166" cy="189" rx="58" ry="58" fill="#1C1612" fill-opacity="0.16"/>
    <!-- Outer Metal Barrel -->
    <circle cx="164" cy="184" r="56" fill="#C7D2CC" stroke="#231D18" stroke-width="2.8" filter="url(#paperGrain)"/>
    <circle cx="164" cy="184" r="56" fill="url(#gouacheSheen)"/>
    <path d="M 123.7 160.5 A 53.0 53.0 0 0 1 195.4 148.2"
          fill="none" stroke="#FFFDF8" stroke-opacity="0.58" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="164" cy="184" r="50.5" fill="none" stroke="#1E7A56" stroke-width="3.4"/>
    <!-- Stepped Inner Barrel -->
    <circle cx="164" cy="184" r="43.7" fill="#18201D" stroke="#191512" stroke-width="2.2"/>
    <circle cx="164" cy="184" r="36.4" fill="#151414" stroke="#6E6860" stroke-width="1.3" stroke-dasharray="2.4 2.8"/>
    <!-- Hand-painted Glass Dome -->
    <circle cx="164" cy="184" r="30.2" fill="url(#lensGlassGreen)" stroke="#0D0B0A" stroke-width="2"/>
    <!-- Expressive Brush Glints -->
    <path d="M 145.5 175.0 A 20.2 20.2 0 0 1 171.8 163.8"
          fill="none" stroke="#FFFDF8" stroke-opacity="0.78" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 152.8 200.8 A 17.9 17.9 0 0 0 174.1 198.6"
          fill="none" stroke="#9BD0EA" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
    <circle cx="157.3" cy="178.4" r="3.1" fill="#FFFFFF" fill-opacity="0.88"/>
    

  </g>
</svg>
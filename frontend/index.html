<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="E-Ink Photo Frame Darkroom Studio - 4.01寸四色墨水屏复古胶片调色与无线NFC烧录">
  <title>E-Ink Darkroom Studio</title>
  
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="ios-app-container">
    <!-- 1. iOS Top Navigation Bar -->
    <header class="ios-nav-bar">
      <div class="nav-left">
        <input type="file" id="fileUploadInput" accept="image/*" style="display: none;">
        <button class="ios-icon-btn" id="btnUploadPhoto" title="从手机相册选择照片">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
          </svg>
          相册
        </button>
        <button class="ios-icon-btn" id="btnOpenSamples" title="切换精选摄影样本">
          ✨ 样本
        </button>
      </div>

      <div class="device-badge-pill" id="deviceStatusPill">
        <span class="device-dot-pulse"></span>
        <span>4.01" NFC 就绪</span>
      </div>

      <div class="nav-right">
        <button class="ios-icon-btn" id="btnResetAll" title="重置构图与调色">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
          </svg>
          重置
        </button>
      </div>
    </header>

    <!-- 2. Central E-Ink Frame & Gesture Touch Stage -->
    <main class="ios-viewport-stage">
      <div id="frameSimContainer">
        <!-- Rendered by FrameSimulator component -->
      </div>

      <!-- Quick Transform & Crop Bar -->
      <div class="quick-transform-bar">
        <button class="transform-chip" id="btnRotateCCW" title="逆时针旋转 90 度">
          ↺ 90°
        </button>
        <button class="transform-chip" id="btnRotateCW" title="顺时针旋转 90 度">
          ↻ 90°
        </button>
        <button class="transform-chip" id="btnFlipH" title="水平镜像翻转">
          ⇄ 翻转
        </button>
        <button class="transform-chip" id="btnToggleSplit" title="原图与墨水屏对比">
          ◨ 对比
        </button>
        <button class="transform-chip active" id="btnToggleTexture" title="纸面反光微质感">
          ▤ 纸质
        </button>
      </div>
    </main>

    <!-- 3. iOS Segmented Tab Bar -->
    <nav class="ios-segmented-tabs">
      <button class="tab-btn active" data-tab="tabPresets">🎞️ 胶片滤镜</button>
      <button class="tab-btn" data-tab="tabToning">🎨 基础调色</button>
      <button class="tab-btn" data-tab="tabFraming">🖼️ 画框算法</button>
    </nav>

    <!-- 4. Interactive Bottom Drawer Panels -->
    <div class="tab-drawer-wrapper">
      <!-- Tab 1: Film Presets (RNI All Films 5 Pro) -->
      <section class="tab-panel active" id="tabPresets">
        <div class="film-shelf-scroll" id="filmShelfContainer">
          <!-- Dynamically populated -->
        </div>
      </section>

      <!-- Tab 2: Darkroom Sliders (Brightness, Contrast, Saturation, Warmth, Sharpness, Red Damper) -->
      <section class="tab-panel" id="tabToning">
        <div class="sliders-grid">
          <!-- 1. Brightness -->
          <div class="slider-unit">
            <div class="slider-header-row">
              <span>☀️ 曝光亮度</span>
              <span class="slider-val-num" id="valBrightness">0</span>
            </div>
            <input type="range" id="sliderBrightness" min="-50" max="50" step="1" value="0">
          </div>

          <!-- 2. Contrast -->
          <div class="slider-unit">
            <div class="slider-header-row">
              <span>◐ 对比度</span>
              <span class="slider-val-num" id="valContrast">1.20</span>
            </div>
            <input type="range" id="sliderContrast" min="0.60" max="1.60" step="0.02" value="1.20">
          </div>

          <!-- 3. Saturation -->
          <div class="slider-unit">
            <div class="slider-header-row">
              <span>🎨 色彩饱和度</span>
              <span class="slider-val-num" id="valSaturation">1.15</span>
            </div>
            <input type="range" id="sliderSaturation" min="0.00" max="2.00" step="0.05" value="1.15">
          </div>

          <!-- 4. Warmth -->
          <div class="slider-unit">
            <div class="slider-header-row">
              <span>🌡️ 胶片色温</span>
              <span class="slider-val-num" id="valWarmth">0</span>
            </div>
            <input type="range" id="sliderWarmth" min="-50" max="50" step="1" value="0">
          </div>

          <!-- 5. Sharpness -->
          <div class="slider-unit">
            <div class="slider-header-row">
              <span>🗡️ 轮廓锐度</span>
              <span class="slider-val-num" id="valSharpness">40%</span>
            </div>
            <input type="range" id="sliderSharpness" min="0" max="100" step="5" value="40">
          </div>

          <!-- 6. Red Damper -->
          <div class="slider-unit">
            <div class="slider-header-row">
              <span>🛡️ 防红斑阻尼</span>
              <span class="slider-val-num" id="valRedDamper">1.15</span>
            </div>
            <input type="range" id="sliderRedDamper" min="1.00" max="1.50" step="0.01" value="1.15">
          </div>
        </div>

        <div class="tone-actions-row">
          <span style="font-size: 11px; color: var(--color-text-tertiary);">
            微调曝光与对比度可有效防止暗部死黑
          </span>
          <button class="pill-btn pill-btn-ghost" id="btnResetTone" style="min-height: 32px; padding: 4px 14px; font-size: 12px;">
            重置影调
          </button>
        </div>
      </section>

      <!-- Tab 3: Framing, Dithering Algorithm & Histogram -->
      <section class="tab-panel" id="tabFraming">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div class="framing-row">
            <button class="framing-btn active" id="btnFramePolaroid">经典拍立得留白边</button>
            <button class="framing-btn" id="btnFrameFull">全屏无边框 (Full Bleed)</button>
          </div>

          <div class="framing-row">
            <button class="framing-btn active" id="btnAtkinson">Atkinson (锐利人像)</button>
            <button class="framing-btn" id="btnFloyd">Floyd-Steinberg (平滑)</button>
          </div>

          <div class="histogram-row">
            <div class="hist-chip">
              <div class="hist-swatch-sm" style="background: var(--color-eink-black);"></div>
              <span style="font-size: 9px; color: var(--color-text-tertiary);">黑 (Black)</span>
              <span class="hist-num" id="histBlackPct">0%</span>
            </div>
            <div class="hist-chip">
              <div class="hist-swatch-sm" style="background: var(--color-eink-white);"></div>
              <span style="font-size: 9px; color: var(--color-text-tertiary);">白 (White)</span>
              <span class="hist-num" id="histWhitePct">0%</span>
            </div>
            <div class="hist-chip">
              <div class="hist-swatch-sm" style="background: var(--color-eink-yellow);"></div>
              <span style="font-size: 9px; color: var(--color-text-tertiary);">黄 (Yellow)</span>
              <span class="hist-num" id="histYellowPct">0%</span>
            </div>
            <div class="hist-chip">
              <div class="hist-swatch-sm" style="background: var(--color-eink-red);"></div>
              <span style="font-size: 9px; color: var(--color-text-tertiary);">红 (Red)</span>
              <span class="hist-num" id="histRedPct">0%</span>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- 5. Sticky Thumb Action Dock -->
    <footer class="ios-bottom-dock">
      <button class="pill-btn btn-refresh-wave" id="btnTriggerRefresh" title="模拟物理相框局部/全局刷新">
        ↻ 模拟刷屏
      </button>
      <button class="pill-btn pill-btn-primary btn-nfc-main" id="btnTriggerFlash">
        ⚡ 烧录至相框 (NFC Flash)
      </button>
    </footer>
  </div>

  <!-- 6. NFC Flash Dialog -->
  <dialog id="nfcModal" closedby="any"></dialog>

  <!-- 7. Sample Photo Picker Action Sheet -->
  <dialog id="sampleSheet" closedby="any">
    <div class="sheet-handle"></div>
    <div class="sheet-title">选择预置摄影样张</div>
    <div class="sheet-options">
      <div class="sheet-item" id="sheetSunset">
        <span>🌅 落日余晖 (Sunset)</span>
        <span class="badge badge-film">高动态风景</span>
      </div>
      <div class="sheet-item" id="sheetPortrait">
        <span>👩 胶片人像 (Portrait)</span>
        <span class="badge badge-film">温润东方肤色</span>
      </div>
      <div class="sheet-item" id="sheetStreet">
        <span>🏙️ 复古街景 (Street)</span>
        <span class="badge badge-film">红黄霓虹光影</span>
      </div>
    </div>
  </dialog>

  <!-- App Bootstrap -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
